<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Received | Rextoration</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0A0E27">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #1A1F3A 0%, #0A0E27 100%);
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            line-height: 1.6;
        }
        .card { max-width: 560px; }
        .check {
            width: 80px; height: 80px; border-radius: 50%;
            background: linear-gradient(135deg, #48BB78 0%, #38A169 100%);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 2rem; font-size: 2.5rem;
            box-shadow: 0 10px 40px rgba(72, 187, 120, 0.4);
        }
        h1 { font-weight: 300; font-size: 2.2rem; margin-bottom: 1rem; }
        p { color: #A8B2C7; margin-bottom: 2rem; font-size: 1.1rem; }
        .actions { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
        a.btn {
            display: inline-block; padding: 1rem 2rem; border-radius: 10px;
            text-decoration: none; font-weight: 700; letter-spacing: 1px;
            text-transform: uppercase; font-size: 0.9rem;
        }
        .btn-primary {
            background: linear-gradient(135deg, #FF6B35 0%, #FF8C5A 100%);
            color: #fff; box-shadow: 0 10px 30px rgba(255, 107, 53, 0.4);
        }
        .btn-secondary {
            border: 2px solid rgba(255, 255, 255, 0.2); color: #fff;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="check" aria-hidden="true">✓</div>
        <h1>Request received.</h1>
        <p>Thank you — we'll contact you shortly about your free quote. If this is an emergency, don't wait: call us right now.</p>
        <div class="actions">
            <a class="btn btn-primary" href="tel:+14085284780">Call 408.528.4780</a>
            <a class="btn btn-secondary" href="/">Back to Home</a>
        </div>
    </div>
</body>
</html>
